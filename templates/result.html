<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兰花品种识别结果</title>
<style>
body { font-family: Arial,sans-serif; max-width:1200px; margin:0 auto; padding:20px; background:#f5f5f5; }
.container { background:#fff; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
h1 { color:#333; margin-bottom:20px; text-align:center; }
.result-area { margin:20px 0; overflow-x:auto; }
.image-preview { max-width:300px; max-height:300px; display:block; margin:0 auto; border-radius:5px; box-shadow:0 0 5px rgba(0,0,0,0.2); }
.result-table { width:100%; border-collapse:collapse; margin:20px 0; min-width:800px; }
.result-table th, .result-table td { padding:12px; text-align:left; border-bottom:1px solid #ddd; }
.result-table th { background:#f2f2f2; font-weight:bold; }
.result-table tr:hover { background:#f9f9f9; }
.probability-bar { height:10px; background:#e0e0e0; border-radius:5px; overflow:hidden; }
.probability-fill { height:100%; background:#4CAF50; transition:width 0.3s ease; }
.back-btn { display:inline-block; background:#4CAF50; color:#fff; padding:10px 20px; text-decoration:none; border-radius:5px; margin-top:20px; }
.back-btn:hover { background:#45a049; }
.filename { text-align:center; margin:10px 0; color:#666; font-style:italic; }
.header-note { color:#666; text-align:center; margin-bottom:20px; }
.description-cell { white-space: pre-wrap; word-wrap: break-word; max-width: 300px; }  /* Add this style for better description formatting */
</style>
</head>
<body>
<div class="container">
<h1>兰花品种识别结果</h1>
<p class="header-note">显示Top 3识别结果，包含完整品种信息</p>
<img src="{{ url_for('static', filename='uploads/' + filename) }}" class="image-preview" alt="上传图片">
<p class="filename">上传图片: {{ filename }}</p>

<div class="result-area">
<table class="result-table">
<tr>
<th>排名</th>
<th>Label</th>
<th>中文栽培品种名</th>
<th>中文物种名</th>
<th>描述</th>  <!-- Added a column for description -->
<th>置信度</th>
</tr>
{% for res in results %}
<tr>
<td>{{ res.ranking }}</td>
<td>{{ res.label }}</td>
<td>{{ res.chinese_cultivar_name }}</td>
<td>{{ res.chinese_species_name }}</td>
<td class="description-cell">{{ res.description }}</td>  <!-- Display description -->
<td>
<div>{{ res.probability }}%</div>
<div class="probability-bar">
<div class="probability-fill" style="width: {{ res.probability }}%"></div>
</div>
</td>
</tr>
{% endfor %}
</table>
</div>

<div style="text-align:center;">
<a href="/" class="back-btn">返回上传更多图片</a>
</div>
</div>
</body>
</html>
